<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Unsubscribe · Community Corner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Libre+Franklin:wght@400;700&display=swap">
<style>
:root{--red:#C3262E;--paper:#F5EEDC;--card:#FFFDF7;--ink:#24192E;--muted:#6A5D70}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Libre Franklin",system-ui,sans-serif}
.head{background:var(--red);padding:12px 16px}.head img{height:52px;display:block}
.card{max-width:480px;margin:40px auto;background:var(--card);border:2px solid var(--ink);padding:24px;margin-inline:16px}
@media(min-width:520px){.card{margin-inline:auto}}
h1{font:400 30px "Lilita One",Impact,sans-serif;margin:0 0 8px}
a{color:var(--red);font-weight:700}
</style>
</head>
<body>
<div class="head"><a href="./"><img src="img/cc-logo.png" alt="Community Corner"></a></div>
<div class="card"><h1 id="h">Unsubscribing…</h1><p id="p">One moment.</p></div>
<script src="config.js"></script>
<script>
(async()=>{
  const t=new URLSearchParams(location.search).get('t'),C=window.CC_CONFIG||{},h=document.getElementById('h'),p=document.getElementById('p');
  const done=(a,b)=>{h.textContent=a;p.innerHTML=b};
  if(!t||!/^[0-9a-f-]{36}$/i.test(t))return done('Link not valid','This unsubscribe link looks broken. Reply to any of our emails and we\'ll take you off the list.');
  try{
    const r=await fetch(`${C.supabaseUrl}/rest/v1/rpc/unsubscribe`,{method:'POST',headers:{apikey:C.supabaseKey,Authorization:'Bearer '+C.supabaseKey,'Content-Type':'application/json'},body:JSON.stringify({t})});
    const ok=r.ok&&await r.json();
    ok?done("You're unsubscribed",'You won\'t get the weekly email anymore. Changed your mind? <a href="./">Sign up again</a> on the homepage.')
      :done('Already removed','This email is not on our list anymore.');
  }catch{done('Something went wrong','Please try the link again in a minute.')}
})();
</script>
</body>
</html>
