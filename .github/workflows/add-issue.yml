name: Add new issue
on:
  push:
    paths: ["uploads/**.pdf", "uploads/**.PDF"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: add-issue
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pip install -q pillow
      - run: python tools/process_uploads.py
      - name: Save to the website
        run: |
          git config user.name "Community Corner bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add new issue from uploads"
          git push
